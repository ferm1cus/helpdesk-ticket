<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT Helpdesk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="auth" class="card narrow" hidden>
    <h1>IT Helpdesk</h1>
    <form id="authForm">
      <label id="nameRow">Name <input id="name"></label>
      <label>Email <input id="email" type="email" required></label>
      <label>Password <input id="password" type="password" required></label>
      <button id="authBtn">Sign in</button>
    </form>
    <p class="muted"><a href="#" id="toggle">Create an account</a></p>
    <p class="muted small">Demo: employee@helpdesk.com / Employee@123 &middot; agent@helpdesk.com / Agent@123 &middot; admin@helpdesk.com / Admin@123</p>
  </section>

  <div id="app" hidden>
    <header>
      <strong>IT Helpdesk</strong>
      <nav id="nav"></nav>
      <span id="who"></span>
      <button class="ghost" onclick="logout()">Sign out</button>
    </header>
    <main id="view"></main>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
